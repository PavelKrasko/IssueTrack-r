# IssueTracker: PostgreSQL + Go API + фронтенд (nginx)
#
#   cp .env.example .env        # задать JWT_SECRET, при желании OAuth-ключи
#   docker compose up --build   # → http://localhost:3000
#
# Только БД для локальной разработки:
#   docker compose up -d postgres
#
# Файлы (картинки задач, документы) хранятся на диске в volume "uploads".
# Чтобы хранить их в S3/MinIO, задайте у api STORAGE_DRIVER: s3 и переменные S3_*.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: issuetracker
      POSTGRES_PASSWORD: issuetracker
      POSTGRES_DB: issuetracker
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://issuetracker:issuetracker@postgres:5432/issuetracker?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env (openssl rand -hex 32)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:3000/api}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: local
      STORAGE_DIR: /data/uploads
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports: ["8080:8080"]   # Swagger: http://localhost:8080/api/docs
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
